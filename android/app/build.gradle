plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = [
    file('key.properties'),
    rootProject.file('key.properties'),
    rootProject.file('../key.properties')
].find { it != null && it.exists() }

if (keystorePropertiesFile != null) {
    keystorePropertiesFile.withReader('UTF-8') { reader ->
        keystoreProperties.load(reader)
    }
}

File resolvedStoreFile = null
def candidateStoreFiles = [
    file('kazumi.jks'),
    rootProject.file('app/kazumi.jks'),
    rootProject.file('kazumi.jks'),
    keystoreProperties.getProperty('storeFile') ? file(keystoreProperties.getProperty('storeFile')) : null,
    keystoreProperties.getProperty('storeFile') ? rootProject.file(keystoreProperties.getProperty('storeFile')) : null,
    keystoreProperties.getProperty('storeFile') ? rootProject.file("app/${keystoreProperties.getProperty('storeFile')}") : null
]
for (def f in candidateStoreFiles) {
    if (f != null && f.exists()) {
        resolvedStoreFile = f
        break
    }
}

def keyAliasValue = System.getenv('KEY_ALIAS') ?: keystoreProperties.getProperty('keyAlias') ?: 'kazumi'
def keyPasswordValue = System.getenv('KEY_PASSWORD') ?: keystoreProperties.getProperty('keyPassword') ?: 'kazumi123'
def storePasswordValue = System.getenv('STORE_PASSWORD') ?: keystoreProperties.getProperty('storePassword') ?: 'kazumi123'


def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

android {
    namespace "com.example.kazumi"
    compileSdk flutter.compileSdkVersion
    // Use the highest NDK required by the native plugins. Newer NDKs remain
    // backward compatible with plugins that declare an older version.
    ndkVersion "28.2.13676358"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.predidit.kazumi"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdkVersion flutter.minSdkVersion
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    signingConfigs {
        release {
            if (resolvedStoreFile != null && resolvedStoreFile.exists()) {
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
                storeFile resolvedStoreFile
                storePassword storePasswordValue
            }
        }
    }

    buildTypes {
        release {
            if (resolvedStoreFile != null && resolvedStoreFile.exists()) {
                println "[Gradle] Configuring Release Signing with Keystore: ${resolvedStoreFile.absolutePath}, alias: ${keyAliasValue}"
                signingConfig signingConfigs.release
            } else {
                println "[Gradle] WARNING: No Release Keystore found! Falling back to Debug signing!"
                signingConfig signingConfigs.debug
            }
        }
    }

}

flutter {
    source '../..'
}

dependencies {}

// F-droid splits APKs by ABI, and requires different versionCode for each ABI.
// For flutter version X.Y.Z, version code is X0Y0ZA, where A is the ABI code.
// See:
// * https://developer.android.com/build/gradle-tips
// * https://developer.android.com/studio/build/configure-apk-splits
// * https://gitlab.com/fdroid/fdroiddata/-/blob/master/metadata/im.nfc.nfsee.yml
ext.abiCodes = ["armeabi-v7a": 1, "arm64-v8a": 2, "x86_64": 4]
import com.android.build.OutputFile
android.applicationVariants.all { variant ->
    variant.outputs.each { output ->
        def abiVersionCode = project.ext.abiCodes.get(output.getFilter(OutputFile.ABI))
        if (abiVersionCode != null) {
            output.versionCodeOverride = variant.versionCode * 10 + abiVersionCode
        }
    }
}
