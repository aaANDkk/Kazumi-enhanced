---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID || 'qb998n8g3u' }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY || '4y2waS6A6yb4uw7Dhd9pmdTzvrF7YUsg' }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID || 'kazumi-hh47hcih6xfodp50' }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY || 'EKlABDVRMb8g5OkCH78SL14riZU4zmkR' }}
  SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 || secrets.KEYSTORE }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  flutter-test:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
        shell: bash

  flutter-build-android:
    name: "Release for android arm64"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Echo build progress
        run: echo "Kazumi_android_arm64-v8a_${{ env.tag }}.apk build progress"
        shell: bash
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - name: Setup Android Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 || secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kazumi' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'kazumi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kazumi123' }}
        run: |
          if [ -n "$SIGNING_KEY_BASE64" ]; then
            echo "Restoring keystore from GitHub Secret..."
            echo "$SIGNING_KEY_BASE64" | base64 -d > android/app/kazumi.jks
            echo "keyAlias=$KEY_ALIAS" > android/key.properties
            echo "storePassword=$STORE_PASSWORD" >> android/key.properties
            echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
            echo "storeFile=app/kazumi.jks" >> android/key.properties
            cp android/key.properties key.properties
            cp android/key.properties android/app/key.properties
            echo "Keystore restored successfully. Size: $(wc -c < android/app/kazumi.jks) bytes."
          else
            echo "WARNING: No SIGNING_KEY_BASE64 secret provided, building with debug fallback."
          fi
        shell: bash
      - name: Build Flutter for Android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kazumi' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'kazumi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kazumi123' }}
        run: >-
          flutter build apk --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
        shell: bash
      - name: Package android arm64 build output
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_arm64-v8a_${{ env.tag }}.apk
        shell: bash
      - name: Verify APK Signature
        run: |
          echo "Verifying APK Signature Details:"
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify -v --print-certs Kazumi_android_arm64-v8a_${{ env.tag }}.apk
        shell: bash
      - name: Upload android outputs
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: Kazumi_android_arm64-v8a_*.apk

  flutter-build-windows:
    name: "Release for windows"
    runs-on: "windows-latest"
    needs: [flutter-test, flutter-analyze]

    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          } else {
            $tag = "latest"
          }
          echo "tag=$tag" >> $env:GITHUB_ENV
      - run: echo "Kazumi_windows_x64_${env:tag}.exe build progress"
      - run: choco install yq
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'
      - run: flutter pub get
      - run: >-
          flutter build windows
          --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
      - name: Build Windows x64 EXE Installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found at default location, installing via choco..."
            choco install innosetup --no-progress
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "Compiling installer with $iscc..."
          & $iscc /DAppVersion=${env:tag} /DOutputBaseFilename="Kazumi_windows_x64_${env:tag}" windows/packaging/exe/inno_setup.iss
      - name: Upload windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: Kazumi_windows_x64_*.exe

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-windows]
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Delete old release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up any existing release for tag ${{ env.tag }}..."
          gh release delete "${{ env.tag }}" --yes --cleanup-tag=false || true
        shell: bash
      - name: Download windows exe build file
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: dist

      - name: Download android build file
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Release ${{ env.tag }}"
          files: |
            dist/*.apk
            dist/*.exe
