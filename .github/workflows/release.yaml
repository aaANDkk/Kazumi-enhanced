---
name: "release"

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Log level'
        required: true
        default: 'warning'

env:
  DANDANAPI_APPID: ${{ secrets.DANDANAPI_APPID || 'qb998n8g3u' }}
  DANDANAPI_KEY: ${{ secrets.DANDANAPI_KEY || '4y2waS6A6yb4uw7Dhd9pmdTzvrF7YUsg' }}
  KAZUMI_APPID: ${{ secrets.KAZUMI_APPID || 'kazumi-hh47hcih6xfodp50' }}
  KAZUMI_KEY: ${{ secrets.KAZUMI_KEY || 'EKlABDVRMb8g5OkCH78SL14riZU4zmkR' }}
  SIGNING_KEY_BASE64: ${{ secrets.KAZUMI || secrets.SIGNING_KEY_BASE64 || secrets.KEYSTORE }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
  STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

jobs:
  validate-release-tag:
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Require the app version tag
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [[ "$GITHUB_REF" != "refs/tags/$version" ]]; then
            echo "::error::Release must run from tag $version. Delete the old release and tag, then push the updated version tag."
            exit 1
          fi
        shell: bash

  flutter-test:
    needs: validate-release-tag
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++
        shell: bash
      - name: Run Flutter tests
        run: flutter test
        shell: bash

  flutter-analyze:
    needs: validate-release-tag
    runs-on: "ubuntu-latest"
    permissions:
      contents: read
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Analyze Flutter project
        run: flutter analyze --no-fatal-infos
        shell: bash

  flutter-build-android:
    name: "Release for android arm64"
    needs: [flutter-test, flutter-analyze]
    runs-on: "ubuntu-latest"
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Echo build progress
        run: echo "Kazumi_android_arm64-v8a_${{ env.tag }}.apk build progress"
        shell: bash
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgtk-3-dev ninja-build libayatana-appindicator3-dev libasound2-dev
        shell: bash
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash
      - name: Remove build id
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt
      - name: Setup Android Keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.KAZUMI || secrets.SIGNING_KEY_BASE64 || secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kazumi' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'kazumi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kazumi123' }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          import sys

          raw = os.environ.get("SIGNING_KEY_BASE64", "")
          if not raw.strip():
              print("::error::Missing Android signing secret (expected KAZUMI, SIGNING_KEY_BASE64, or KEYSTORE).")
              sys.exit(1)

          text = raw.lstrip("\ufeff").strip()
          has_pem = "-----BEGIN" in text
          text = re.sub(r"-----[^-]+-----", "", text)
          text = text.strip().strip("\"'")
          cleaned = re.sub(r"\s+", "", text)
          cleaned = cleaned.replace("-", "+").replace("_", "/")
          bad_chars = sorted({c for c in cleaned if c not in "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/="})
          if bad_chars:
              print(f"::error::SIGNING_KEY_BASE64 contains invalid base64 characters (raw_len={len(raw)}, has_pem={has_pem}, bad_count={len(bad_chars)}).")
              sys.exit(1)
          if len(cleaned) % 4 != 0:
              cleaned += "=" * (4 - len(cleaned) % 4)
          try:
              data = base64.b64decode(cleaned, validate=True)
          except Exception as exc:
              print(f"::error::Failed to decode SIGNING_KEY_BASE64 (raw_len={len(raw)}, clean_len={len(cleaned)}, has_pem={has_pem}): {exc}")
              sys.exit(1)

          if not data:
              print("::error::Decoded Android keystore is empty.")
              sys.exit(1)

          magic = data[:4].hex()
          if magic not in ("feedfeed", "cececece") and not magic.startswith("3082"):
              try:
                  nested = re.sub(r"\s+", "", data.decode("ascii"))
                  if len(nested) % 4 != 0:
                      nested += "=" * (4 - len(nested) % 4)
                  data2 = base64.b64decode(nested, validate=True)
                  if data2[:4].hex() in ("feedfeed", "cececece") or data2[:2].hex() == "3082":
                      data = data2
                      magic = data[:4].hex()
              except Exception:
                  pass

          with open("android/app/kazumi.jks", "wb") as f:
              f.write(data)
          print(f"Keystore decoded successfully: {len(data)} bytes (magic={magic}, raw_len={len(raw)}, has_pem={has_pem}).")
          PY
          keytool -list -keystore android/app/kazumi.jks -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" || {
            echo "::error::keytool failed to verify restored android/app/kazumi.jks with alias '$KEY_ALIAS'."
            exit 1
          }
          echo "keyAlias=$KEY_ALIAS" > android/key.properties
          echo "storePassword=$STORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "storeFile=app/kazumi.jks" >> android/key.properties
          cp android/key.properties key.properties
          cp android/key.properties android/app/key.properties
          echo "Keystore restored successfully. Size: $(wc -c < android/app/kazumi.jks) bytes."
        shell: bash
      - name: Build Flutter for Android
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'kazumi' }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'kazumi123' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'kazumi123' }}
        run: >-
          flutter build apk --split-per-abi
          --dart-define=DANDANAPI_APPID=$DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$KAZUMI_KEY
        shell: bash
      - name: Package android arm64 build output
        run: cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk Kazumi_android_arm64-v8a_${{ env.tag }}.apk
        shell: bash
      - name: Verify APK Signature
        run: |
          echo "Verifying APK Signature Details:"
          VERIFY_OUT=$($ANDROID_HOME/build-tools/34.0.0/apksigner verify -v --print-certs Kazumi_android_arm64-v8a_${{ env.tag }}.apk)
          echo "$VERIFY_OUT"
          if echo "$VERIFY_OUT" | grep -q "CN=Android Debug"; then
            echo "::error::APK was signed with debug certificate instead of release keystore!"
            exit 1
          fi
        shell: bash
      - name: Upload android outputs
        uses: actions/upload-artifact@v4
        with:
          name: android_outputs
          path: Kazumi_android_arm64-v8a_*.apk

  flutter-build-windows:
    name: "Release for windows"
    runs-on: "windows-latest"
    needs: [flutter-test, flutter-analyze]

    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $tag = $env:GITHUB_REF.Replace('refs/tags/', '')
          } else {
            $tag = "latest"
          }
          echo "tag=$tag" >> $env:GITHUB_ENV
      - run: echo "Kazumi_windows_x64_${env:tag}.exe build progress"
      - run: choco install yq
      - name: Enable Git longpaths
        run: git config --system core.longpaths true
      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '18'
      - run: flutter pub get
      - run: >-
          flutter build windows
          --dart-define=DANDANAPI_APPID=$env:DANDANAPI_APPID
          --dart-define=DANDANAPI_KEY=$env:DANDANAPI_KEY
          --dart-define=KAZUMI_APPID=$env:KAZUMI_APPID
          --dart-define=KAZUMI_KEY=$env:KAZUMI_KEY
      - name: Build Windows x64 EXE Installer
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found at default location, installing via choco..."
            choco install innosetup --no-progress
            $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
            if (-not $iscc) {
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            }
          }
          Write-Host "Compiling installer with $iscc..."
          & $iscc /DAppVersion=${env:tag} /DOutputBaseFilename="Kazumi_windows_x64_${env:tag}" windows/packaging/exe/inno_setup.iss
      - name: Upload windows outputs
        uses: actions/upload-artifact@v4
        with:
          name: windows_outputs
          path: Kazumi_windows_x64_*.exe

  release:
    name: "Release"
    runs-on: "ubuntu-latest"
    needs: [flutter-build-android, flutter-build-windows]
    permissions: write-all
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Extract tag name
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV
          else
            echo "tag=latest" >> $GITHUB_ENV
          fi
        shell: bash
      - name: Delete old release if exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Cleaning up any existing release for tag ${{ env.tag }}..."
          gh release delete "${{ env.tag }}" --yes --cleanup-tag=false || true
        shell: bash
      - name: Download windows exe build file
        uses: actions/download-artifact@v4
        with:
          name: windows_outputs
          path: dist

      - name: Download android build file
        uses: actions/download-artifact@v4
        with:
          name: android_outputs
          path: dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.tag }}
          name: "Release ${{ env.tag }}"
          files: |
            dist/*.apk
            dist/*.exe
